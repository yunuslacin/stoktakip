{% extends 'base.html' %}
{% block content %}
<h1 class="mb-3">Stok Girişi</h1>

<form method="post" id="entry-form">
  <div class="table-responsive mb-3">
    <table class="table table-sm align-middle" id="entry-table">
      <thead>
        <tr>
          <th style="width: 20%">Ürün</th>
          <th style="width: 12%">Miktar</th>
          <th style="width: 12%">Birim Maliyet</th>
          <th style="width: 16%">Tedarikçi</th>
          <th style="width: 16%">Fatura No</th>
          <th style="width: 16%">Depo</th>
          <th style="width: 8%" class="text-end">İşlem</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <button type="button" class="btn btn-outline-secondary" id="add-entry-row">Satır Ekle</button>
    <div class="fw-semibold">Toplam Maliyet: <span id="total-cost">0.00</span> ₺</div>
  </div>
  <div class="text-end">
    <button type="submit" class="btn btn-primary">Tamam</button>
  </div>
</form>

<script>
  (function() {
    const tableBody = document.querySelector('#entry-table tbody');
    const addButton = document.getElementById('add-entry-row');
    const totalCostEl = document.getElementById('total-cost');
    const productOptions = `
      <option value="">Seçiniz</option>
      {% for product in products %}
      <option value="{{ product.id }}">{{ product.name|e }}</option>
      {% endfor %}`;
    const warehouseOptions = `
      <option value="">Seçiniz</option>
      {% for warehouse in warehouses %}
      <option value="{{ warehouse.id }}">{{ warehouse.name|e }}</option>
      {% endfor %}`;

    function recalcTotal() {
      let total = 0;
      tableBody.querySelectorAll('tr').forEach(row => {
        const qty = parseFloat(row.querySelector('input[name="quantity[]"]').value.replace(',', '.')) || 0;
        const cost = parseFloat(row.querySelector('input[name="unit_cost[]"]').value.replace(',', '.')) || 0;
        total += qty * cost;
      });
      totalCostEl.textContent = total.toFixed(2);
    }

    function attachListeners(row) {
      row.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', recalcTotal);
      });
      row.querySelector('.remove-row').addEventListener('click', () => {
        if (tableBody.children.length > 1) {
          row.remove();
          recalcTotal();
        } else {
          row.querySelectorAll('select, input').forEach(el => el.value = '');
          recalcTotal();
        }
      });
    }

    function createRow() {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <select name="product_id[]" class="form-select" required>
            ${productOptions}
          </select>
        </td>
        <td>
          <input type="number" name="quantity[]" class="form-control" min="0.01" step="0.01" required>
        </td>
        <td>
          <input type="number" name="unit_cost[]" class="form-control" min="0" step="0.01" required>
        </td>
        <td>
          <input type="text" name="supplier[]" class="form-control" placeholder="Opsiyonel">
        </td>
        <td>
          <input type="text" name="invoice_number[]" class="form-control" placeholder="Opsiyonel">
        </td>
        <td>
          <select name="warehouse_id[]" class="form-select">
            ${warehouseOptions}
          </select>
        </td>
        <td class="text-end">
          <button type="button" class="btn btn-outline-danger btn-sm remove-row">Sil</button>
        </td>`;
      attachListeners(tr);
      return tr;
    }

    function addRow() {
      tableBody.appendChild(createRow());
      recalcTotal();
    }

    addButton.addEventListener('click', addRow);
    addRow();
  })();
</script>
{% endblock %}
