{% extends 'base.html' %}
{% block content %}
<h1>Manuel Stok Düzeltme</h1>
<form method="post" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">Ürün</label>
    <select name="product_id" class="form-select" required>
      <option value="">Seçiniz</option>
      {% for product in products %}
      <option value="{{ product.id }}">{{ product.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Değişim</label>
    <input type="number" step="1" name="quantity_change" class="form-control" required>
    <div class="form-text">Pozitif değer stok ekler, negatif değer düşer.</div>
  </div>
  <div class="col-md-4">
    <label class="form-label">Neden</label>
    <input type="text" name="reason" class="form-control" required>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Kaydet</button>
  </div>
</form>
{% endblock %}
