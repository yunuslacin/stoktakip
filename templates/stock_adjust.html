{% extends 'base.html' %}
{% block content %}
<h1>Stok Düzeltme</h1>
<form method="post" class="row g-3 mt-2">
  <div class="col-md-4">
    <label class="form-label">Ürün</label>
    <select name="product_id" class="form-select" required>
      <option value="" disabled selected>Seçiniz</option>
      {% for product in products %}
      <option value="{{ product.id }}">{{ product.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Miktar (+/-)</label>
    <input type="number" name="quantity" class="form-control" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Birim Maliyet (pozitif düzeltmeler)</label>
    <input type="number" step="0.01" name="unit_cost" class="form-control" min="0">
  </div>
  <div class="col-12">
    <label class="form-label">Sebep</label>
    <input type="text" name="reason" class="form-control">
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-warning">Kaydet</button>
  </div>
</form>
{% endblock %}
