{% extends 'base.html' %}
{% block content %}
<h1>Kullanıcı Aktivite Logları</h1>
<div class="table-responsive">
  <table class="table table-striped table-sm">
    <thead>
      <tr>
        <th>Tarih</th>
        <th>Kullanıcı</th>
        <th>İşlem</th>
        <th>Detay</th>
      </tr>
    </thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td>{{ log.timestamp|local_datetime }}</td>
        <td>{{ log.user.username if log.user else '-' }}</td>
        <td>{{ log.action }}</td>
        <td>{{ log.details }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="text-center">Kayıt bulunamadı</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
