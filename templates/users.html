{% extends 'base.html' %}
{% block content %}
<h1>Kullanıcı Yönetimi</h1>
<div class="row g-4 mt-2">
  <div class="col-lg-4">
    <div class="card shadow-sm">
      <div class="card-header">Yeni Kullanıcı</div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Kullanıcı Adı</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Şifre</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Rol</label>
            <select name="role" class="form-select">
              <option value="user">Kullanıcı</option>
              <option value="admin">Yönetici</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Yönetici</label>
            <select name="manager_id" class="form-select">
              <option value="">-</option>
              {% for user in users %}
              <option value="{{ user.id }}">{{ user.username }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Kaydet</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header">Kullanıcılar</div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Kullanıcı</th>
                <th>Rol</th>
                <th>Yönetici</th>
                <th>İşlemler</th>
              </tr>
            </thead>
            <tbody>
              {% for user in users %}
              <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.role }}</td>
                <td>{{ user.manager.username if user.manager else '-' }}</td>
                <td>
                  <form method="post" action="{{ url_for('reset_password', user_id=user.id) }}" class="d-flex align-items-center gap-2">
                    <input type="text" name="new_password" class="form-control form-control-sm" placeholder="Yeni şifre" required>
                    <button class="btn btn-sm btn-outline-secondary">Sıfırla</button>
                  </form>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
