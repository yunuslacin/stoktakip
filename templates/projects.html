{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Projeler</h1>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="card-title">Yeni Proje Ekle</h5>
    <form method="post" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Proje Adı</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Açıklama</label>
        <input type="text" name="description" class="form-control">
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>
  </div>
</div>

<div class="table-responsive">
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>Ad</th>
        <th>Açıklama</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for project in projects %}
      <tr>
        <td colspan="3">
          <form method="post" action="{{ url_for('update_project', project_id=project.id) }}" class="row g-2 align-items-end">
            <div class="col-md-4">
              <label class="form-label">Proje Adı</label>
              <input type="text" name="name" class="form-control" value="{{ project.name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Açıklama</label>
              <input type="text" name="description" class="form-control" value="{{ project.description or '' }}">
            </div>
            <div class="col-md-2 d-grid">
              <button type="submit" class="btn btn-outline-primary">Güncelle</button>
            </div>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="text-center">Proje bulunamadı</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
